<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nowy rozdział — odliczanie</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#5b1b98;background:#4bd9d3}main{min-height:100vh;overflow:hidden;position:relative;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#74ebe5 0,#4bd9d3 46%,#36c9c4 100%)}main.waiting{color:#fff;background:radial-gradient(circle at 50% 20%,#8652c3 0,#6330a1 60%)}header{min-height:100px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 5vw;border-bottom:1px solid currentColor}.taka{display:grid;line-height:.75;font-size:14px;font-weight:700}.taka b{font-size:29px}.when{justify-self:end;font-size:38px;font-weight:900;letter-spacing:-3px}.mid{font-size:11px;letter-spacing:3px;font-weight:900}.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:45px 20px 35px}.kicker{font-size:12px;letter-spacing:3px;font-weight:900}.hero h1{max-width:1050px;margin:15px 0 0;font-size:clamp(40px,6vw,88px);line-height:.92;letter-spacing:-5px;text-transform:uppercase}.timer{display:flex;gap:clamp(18px,3vw,54px);margin:45px 0 38px}.unit{position:relative;display:grid;min-width:clamp(92px,12vw,170px);padding:25px 12px;border:2px solid currentColor;border-radius:28px;background:#ffffff26;box-shadow:8px 8px 0 #5b1b9833}.unit b{font-size:clamp(48px,8vw,118px);line-height:.75;letter-spacing:-7px;font-variant-numeric:tabular-nums}.unit small{margin-top:18px;font-size:9px;letter-spacing:2px;font-weight:900}.unit i{position:absolute;top:45%;right:calc(clamp(18px,3vw,54px)*-.7);font-size:40px;font-style:normal}.note{max-width:650px;margin:0;font-size:20px;line-height:1.45;font-weight:700}.note em{font-style:normal;font-size:28px;margin-right:10px}.badge{margin-top:28px;padding:14px 21px;border:2px solid currentColor;border-radius:100px;background:#fff;box-shadow:6px 6px 0 currentColor;font-size:11px;letter-spacing:1px;font-weight:900}.journey{margin:0 5vw 28px}.labels{display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:14px}.labels div{display:grid;gap:3px}.labels div:nth-child(2){text-align:center}.labels div:last-child{text-align:right}.labels span{font-size:13px;letter-spacing:2px;font-weight:900}.labels b{font-family:Georgia,serif;font-size:19px;font-style:italic}.track{position:relative;height:8px;border:2px solid currentColor}.progress{height:100%;background:currentColor}.marker{position:absolute;top:50%;width:34px;height:34px;display:grid;place-items:center;border:2px solid currentColor;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}footer{display:grid;grid-template-columns:1fr auto 1fr;padding:14px 5vw;border-top:1px solid currentColor;font-size:10px;letter-spacing:2px;font-weight:900}footer span:last-child{text-align:right}.float{position:absolute;top:-40px;animation:fall 8s linear infinite;font-size:20px}@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}
@media(max-width:680px){header{min-height:78px}.mid{display:none}header{grid-template-columns:1fr 1fr}.hero{padding-top:35px}.hero h1{letter-spacing:-3px}.timer{width:100%;gap:7px}.unit{min-width:0;flex:1;padding:16px 3px;border-radius:16px;box-shadow:3px 3px 0 #5b1b9833}.unit b{font-size:clamp(38px,15vw,64px);letter-spacing:-4px}.unit i{right:-8px;font-size:18px}.unit small{font-size:7px;letter-spacing:1px}.labels b{font-size:15px}footer{grid-template-columns:1fr auto}footer p{display:none}}
.congrats{margin:0 0 18px;padding:10px 18px;border-radius:100px;background:#5b1b98;color:#4bd9d3;font-size:clamp(15px,1.4vw,20px);font-weight:900;box-shadow:5px 5px 0 #ffffffb3;animation:cheer 2s ease-in-out infinite}@keyframes cheer{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(1deg) scale(1.04)}}
/* Kompaktowy układ mieszczący się na jednym ekranie */
header{min-height:82px;padding:14px 5vw}.hero{padding:24px 20px 22px}.congrats{margin-bottom:11px;padding:8px 16px;font-size:clamp(14px,1.2vw,18px)}.kicker{font-size:10px}.hero h1{font-size:clamp(34px,4.7vw,68px);margin-top:10px}.timer{gap:clamp(14px,2.4vw,38px);margin:28px 0 24px}.unit{min-width:clamp(84px,10vw,145px);padding:18px 10px;border-radius:24px;box-shadow:6px 6px 0 #5b1b9833}.unit b{font-size:clamp(44px,7.2vw,102px)}.unit small{margin-top:12px}.unit i{right:calc(clamp(14px,2.4vw,38px)*-.72);font-size:clamp(21px,2.5vw,34px)}.badge{margin-top:17px;padding:10px 18px}.journey{margin-bottom:20px}
@media(max-width:680px){.hero{padding:22px 12px 18px}.hero h1{font-size:clamp(29px,10vw,48px)}.timer{gap:6px;margin:25px 0 22px}.unit{padding:12px 2px;border-radius:14px}.unit b{font-size:clamp(34px,13vw,56px)}.unit i{right:-8px;font-size:18px}.note{font-size:16px}.labels span{font-size:10px}.labels b{font-size:14px}}
main.vacation{color:#ffe600;background:radial-gradient(circle at 50% 20%,#ef3b3f 0,#d71920 64%)}main.farewell{color:#5b1b98;background:radial-gradient(circle at 50% 20%,#fff9a8 0,#fff36b 64%)}.mkflag{position:absolute;top:18px;right:5vw;font-size:clamp(34px,4vw,58px);filter:drop-shadow(4px 5px 0 #5b1b9833);animation:wave 2.4s ease-in-out infinite}.labels{grid-template-columns:repeat(4,1fr)}.labels div:nth-child(2),.labels div:nth-child(3){text-align:center}@keyframes wave{0%,100%{transform:rotate(-4deg) scaleX(1)}50%{transform:rotate(4deg) scaleX(.9)}}@media(max-width:680px){.mkflag{top:10px;right:12px;font-size:30px}.labels span{font-size:8px;letter-spacing:1px}}
</style>
<style>.vacline{position:absolute;z-index:-1;inset:-2px auto -2px 1.5%;width:65.2%;border:2px solid #d71920;background:#ffe600}.vacline span{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);padding:4px 9px;border-radius:99px;background:#ffe600;color:#d71920;font-size:9px;font-weight:900;letter-spacing:1px;white-space:nowrap}@media(max-width:680px){.vacline span{bottom:12px;padding:3px 6px;font-size:7px}}</style>
<style>.track{isolation:isolate}.track .progress{position:relative;z-index:1}.track .vacline{z-index:0}</style>
</head>
<body><main id="app">
<header><div class="taka">GRUPA<b>TAKA</b></div><div class="mid">ZMIANA W TOKU</div><div class="when">when<sup>®</sup></div></header>
<section class="hero"><div class="congrats">🥳 Brawo Justyna! 💜</div><div class="kicker" id="kicker"></div><h1 id="title"></h1><div class="timer" id="timer"></div><p class="note"><em id="emoji"></em><span id="note"></span></p><div class="badge" id="badge"></div></section>
<section class="journey"><div class="labels"><div><span>06.08 · 16:00</span><b>Koniec pracy 🎉</b></div><div><span>07–23.08</span><b>Urlop w Macedonii ☀️</b></div><div><span>24–25.08</span><b>Pożegnanie z GT 👋</b></div><div><span>01.09</span><b>Let's go, WHEN 🚀</b></div></div><div class="track"><div class="progress" id="progress"></div><div class="marker" id="marker">✨</div></div></section>
<footer><span>NOWY ROZDZIAŁ</span><p>Od napędzania zmian do wygrywania razem.</p><span>2026</span></footer>
</main>
<script>
const VACATION=Date.parse('2026-08-06T16:00:00+02:00'),FAREWELL=Date.parse('2026-08-24T00:00:00+02:00'),GTEND=Date.parse('2026-08-26T00:00:00+02:00'),START=Date.parse('2026-09-01T00:00:00+02:00'),BEGIN=VACATION;
['✨','💜','⚡','🚀','🥳','✨','💜','⚡'].forEach((x,i)=>{let e=document.createElement('i');e.className='float';e.textContent=x;e.style.left=(4+i*13)+'%';e.style.animationDelay=(-i*1.1)+'s';app.appendChild(e)});
function update(){let n=Date.now(),phase=n<VACATION?'leaving':n<FAREWELL?'vacation':n<GTEND?'farewell':n<START?'waiting':'started',target=phase==='leaving'?VACATION:phase==='vacation'?FAREWELL:phase==='farewell'?GTEND:START,d=Math.max(0,target-n),sets={leaving:['AKT I · OSTATNIE GODZINY','Do końca pracy przed urlopem','⏰','O 16:00 zamykasz komputer. Potem góry, słońce, nowe widoki i wielka bałkańska przygoda!','6 SIERPNIA · 16:00 · START URLOPU ↗'],vacation:['AKT II · MACEDOŃSKA PRZYGODA','Macedonia czeka! ⛰️','😎','Odkrywaj Bałkany, kolekcjonuj widoki i ładuj baterie. Do GT wracasz już tylko na piękne pożegnanie.','24–25 SIERPNIA · OSTATNIE DNI W GT ↗'],farewell:['AKT III · PIĘKNY FINAŁ','Czas pożegnać GT 👋','👋','Ostatnie wspólne chwile, dobre słowa i zamknięcie ważnego rozdziału.','24–25 SIERPNIA · POŻEGNANIE ↗'],waiting:['AKT IV · ŁADOWANIE NOWEGO','Do pierwszego dnia w WHEN 🚀','🔋','Stary rozdział zamknięty. Nowa energia już się ładuje.','1 WRZEŚNIA · START W WHEN ↗'],started:['AKT V · NOWY ROZDZIAŁ','To właśnie dziś! 🚀','🥳','Nowe miejsce, nowi ludzie, nowe pomysły. Będzie świetnie!','#WHENWEWIN 💜']},data=sets[phase];app.className=phase;kicker.textContent=data[0];title.textContent=data[1];emoji.textContent=data[2];note.textContent=data[3];badge.textContent=data[4];let vals=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60],labs=['DNI','GODZIN','MINUT','SEKUND'];timer.innerHTML=phase==='started'?'<div style="font-size:150px">🚀</div>':vals.map((v,i)=>`<div class="unit"><b>${String(v).padStart(2,'0')}</b><small>${labs[i]}</small>${i<3?'<i>:</i>':''}</div>`).join('');let p=Math.min(100,Math.max(0,(n-BEGIN)/(START-BEGIN)*100));progress.style.width=p+'%';marker.style.left=p+'%'}update();setInterval(update,1000);
</script></body></html>
